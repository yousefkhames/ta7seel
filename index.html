<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ta7seel — تحصيل</title>
  <meta name="description" content="Ta7seel: invoice chasing tracker for freelancers with escalating reminders. تحصيل: متابعة فواتير المستقلين بتذكيرات متصاعدة.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand" id="brand">
        <span class="brand-logo" id="brand-logo">💸</span>
        <span class="brand-text">
          <strong id="brand-name">Ta7seel</strong>
          <small id="brand-tagline"></small>
        </span>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title"></h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
